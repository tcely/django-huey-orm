name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade uv
        printf -- '\n%s\n' >> requirements.txt \
            pylint ruff
        UV_BREAK_SYSTEM_PACKAGES=1 \
        UV_COMPILE_BYTECODE=1 \
        UV_NO_CACHE=1 UV_NO_CONFIG=1 \
        UV_NO_PROGRESS=1 UV_SYSTEM_PYTHON=1 \
        uv pip install -r requirements.txt
    - name: Analysing the code with pylint
      continue-on-error: true
      run: |
        pylint $(git ls-files '*.py')
    - name: Check with ruff
      continue-on-error: false
      run: |
          target_version='py38'
          ignore_csv_list='E701,E722,E731'
          cd tubesync
          # output formats:
          # "full" | "concise" | "grouped" |
          # "json" | "junit" | "github" | "gitlab" |
          # "pylint" | "azure"
          {
              echo '## Output from `ruff check` for `tubesync`'
              echo ''
              echo '### Formats'
              echo ''
              for fmt in full concise grouped pylint
              do
              echo '<details>'
              echo '<summary>'"${fmt}"'</summary>'
              echo ''
              echo '#### '"${fmt}"' output format'
              echo ''
              echo '```'
              uv tool run --no-config --no-progress \
                  ruff check --exit-zero \
                  --target-version "${target_version}" \
                  --output-format "${fmt}" \
                  --extend-select RUF100 \
                  --ignore "${ignore_csv_list}"
              echo ''
              echo '```'
              echo ''
              echo '</details>'
              echo ''
              done
          } >> "${GITHUB_STEP_SUMMARY}"
          uv tool run --no-config --no-progress \
              ruff check \
              --target-version "${target_version}" \
              --output-format github \
              --ignore "${ignore_csv_list}"


